services:
  - type: web
    name: hustle-city-api
    runtime: node
    rootDir: backend
    plan: starter
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: hustle-city-api-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/hustle-city
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://hustle-city-web.onrender.com
      - key: PREMIUM_CHECKOUT_ENABLED
        value: "0"
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

  - type: web
    name: hustle-city-web
    runtime: static
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run export:web
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24.15.0"
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://hustle-city-api.onrender.com
      - key: EXPO_PUBLIC_MONETIZATION_ENABLED
        value: "0"
      - key: EXPO_PUBLIC_PUBLIC_WEB_BASE_URL
        value: https://hustle-city-web.onrender.com
    routes:
      - type: rewrite
        source: /privacy/
        destination: /privacy/index.html
      - type: rewrite
        source: /delete-account/
        destination: /delete-account/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /delete-account
        destination: /delete-account/index.html
      - type: rewrite
        source: /*
        destination: /index.html
